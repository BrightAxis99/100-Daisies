<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Hundred Daisies</title>
<style>
  :root{
    --ink:#1a2238; --ink-soft:#48506b; --line:#2b3a67;
    --accent:#e0a458; --accent-deep:#c98a3c;
    --card:#fbf7ef; --paper:#ece3d2; --paper-2:#e4d9c2; --rule:#d8cdb6;
    --red:#c0392b; --good:#3f7d5a;
    --shadow:0 14px 32px -22px rgba(26,34,56,.55);
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #f0e8d6 0%, var(--paper) 55%, var(--paper-2) 100%) fixed;
    color:var(--ink); font-family:var(--sans);
    min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:18px 14px 40px;
  }
  a{color:inherit}
  .wrap{width:100%; max-width:720px; margin:0 auto}

  /* ---------- top bar ---------- */
  .bar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; min-height:40px}
  .brand{font-family:var(--serif); font-weight:700; font-size:1.15rem; letter-spacing:.01em; display:flex; align-items:center; gap:8px}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #f3ecdc}
  .bar-right{display:flex; align-items:center; gap:10px}
  .pill{font-family:var(--serif); font-size:.85rem; color:var(--ink-soft); background:var(--card); border:1px solid var(--rule); border-radius:999px; padding:5px 12px}
  .btn-home{font-family:var(--sans); font-size:.85rem; border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:7px 12px; cursor:pointer}
  .btn-home:hover{background:#fff}

  /* ---------- home ---------- */
  .hero{text-align:center; margin:10px 0 22px}
  .hero h1{font-family:var(--serif); font-size:2.3rem; font-weight:700; letter-spacing:-.01em; line-height:1.05}
  .hero .sub{color:var(--ink-soft); margin-top:8px; font-size:.98rem}
  .hero .count{font-family:var(--serif); color:var(--accent-deep); font-weight:700; margin-top:12px; font-size:1rem}

  .scope{display:flex; align-items:center; gap:10px; justify-content:center; margin:6px 0 20px; flex-wrap:wrap}
  .scope label{font-size:.85rem; color:var(--ink-soft)}
  .scope select{font-family:var(--sans); font-size:.9rem; padding:7px 10px; border:1.5px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); cursor:pointer}

  .modes{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:520px){.modes{grid-template-columns:1fr}}
  .mode{
    text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:16px;
    padding:18px 18px 16px; cursor:pointer; box-shadow:var(--shadow); position:relative;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .mode:hover{transform:translateY(-2px); box-shadow:0 20px 40px -22px rgba(26,34,56,.6)}
  .mode:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .mode .step{font-family:var(--serif); font-size:.8rem; color:var(--accent-deep); font-weight:700; letter-spacing:.14em}
  .mode h3{font-family:var(--serif); font-size:1.3rem; margin:4px 0 6px}
  .mode p{font-size:.86rem; color:var(--ink-soft); line-height:1.45}
  .mode .how{margin-top:10px; font-size:.75rem; color:var(--ink-soft); font-style:italic}

  /* ---------- progress grid ---------- */
  .prog{margin-top:24px}
  .prog h4{font-family:var(--serif); font-size:1rem; margin-bottom:4px}
  .prog .legend{font-size:.75rem; color:var(--ink-soft); margin-bottom:10px; display:flex; gap:14px; flex-wrap:wrap}
  .legend b{font-weight:600}
  .sw{display:inline-block; width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px;border:1px solid var(--rule)}
  .grid101{display:grid; grid-template-columns:repeat(auto-fill,minmax(30px,1fr)); gap:5px}
  .cell{aspect-ratio:1; border-radius:6px; border:1px solid var(--rule); background:var(--card); font-family:var(--serif); font-size:.62rem; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer}
  .cell.seen{background:#f4e6c9; color:var(--accent-deep)}
  .cell.mastered{background:var(--accent); color:#3a2c10; border-color:var(--accent-deep); font-weight:700}
  .cell:hover{outline:2px solid var(--accent)}

  /* ---------- play surface ---------- */
  .play{display:none}
  .play.active{display:block}
  .stage{background:var(--card); border:1.5px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:22px 20px; position:relative}
  .stage::before{content:"";position:absolute;inset:6px;border:1px solid var(--rule);border-radius:13px;pointer-events:none}
  .stage .inner{position:relative}

  .prompt-label{text-align:center; font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft)}
  .bignum{font-family:var(--serif); font-weight:700; font-size:4.2rem; color:var(--accent-deep); text-align:center; line-height:1; margin:6px 0}
  .iconbox{width:150px;height:150px;margin:6px auto; display:flex; align-items:center; justify-content:center}
  .iconbox svg{width:100%;height:100%}
  .iconbox.sm{width:74px;height:74px;margin:0 auto}
  .theword{font-family:var(--serif); font-weight:600; font-size:1.9rem; text-align:center}
  .thecap{text-align:center; font-style:italic; color:var(--ink-soft); font-size:.82rem; margin-top:2px}

  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px}
  .opt{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; font-family:var(--serif); transition:transform .1s, background .1s}
  .opt:hover{background:#fff; transform:translateY(-1px)}
  .opt:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .opt .num-opt{font-size:2rem; font-weight:700; color:var(--ink)}
  .opt .word-opt{font-size:1.05rem}
  .opt.correct{background:#e7f1ea; border-color:var(--good)}
  .opt.wrong{background:#f6e3e0; border-color:var(--red)}
  .opt[disabled]{cursor:default}

  .typerow{display:flex; gap:10px; margin-top:20px}
  .typerow input{flex:1; font-family:var(--serif); font-size:1.4rem; text-align:center; padding:12px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink)}
  .typerow input:focus{outline:3px solid var(--accent); outline-offset:1px}
  .btn{font-family:var(--sans); font-weight:600; border:1.5px solid var(--line); background:var(--ink); color:#fdf8ee; border-radius:12px; padding:0 20px; cursor:pointer; font-size:1rem}
  .btn:hover{background:#0f1730}
  .btn.ghost{background:var(--card); color:var(--ink)}
  .btn.ghost:hover{background:#fff}
  .btn.gold{background:var(--accent); color:#3a2c10; border-color:var(--accent-deep)}
  .btn.wide{width:100%; padding:14px}

  .feedback{text-align:center; min-height:26px; margin-top:14px; font-family:var(--serif); font-size:1.05rem}
  .feedback.good{color:var(--good)}
  .feedback.bad{color:var(--red)}

  .controls{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:16px}
  .scoreline{font-family:var(--serif); color:var(--ink-soft); font-size:.95rem; display:flex; gap:16px; align-items:center; justify-content:center; margin-bottom:4px}
  .scoreline b{color:var(--ink)}
  .timer{font-family:var(--serif); font-weight:700; font-size:1.3rem; color:var(--accent-deep)}
  .timerbar{height:8px; background:var(--paper-2); border-radius:99px; overflow:hidden; margin:8px 0 4px}
  .timerbar > i{display:block; height:100%; background:var(--accent); width:100%; transition:width .25s linear}

  /* ---------- daisy rain (arcade / falling) ---------- */
  .rlives{display:flex; gap:5px; align-items:center}
  .rlife{font-size:1.05rem; line-height:1}
  .rlife.spent{opacity:.22; filter:grayscale(1)}
  .stage.rain{padding:0; overflow:hidden}
  .stage.rain::before{inset:0; border:none}
  .sky{position:relative; height:min(70vh,620px); overflow:hidden;
       background:linear-gradient(180deg,#f4ecda 0%,var(--card) 72%); border-radius:16px}
  .sky .ground{position:absolute; left:0; right:0; bottom:0; height:3px;
       background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 20px); opacity:.5}
  .rcard{position:absolute; top:0; left:50%; transform:translateX(-50%);
         width:132px; background:var(--card); border:1.5px solid var(--line);
         border-radius:14px; box-shadow:var(--shadow); padding:12px 10px; text-align:center; will-change:top}
  .rcard .rnum{font-family:var(--serif); font-weight:700; font-size:2.7rem; color:var(--accent-deep); line-height:1}
  .rcard .ricon{width:82px; height:82px; margin:0 auto}
  .rcard .ricon svg{width:100%; height:100%}
  .rcard .rword{font-family:var(--serif); font-weight:600; font-size:1.05rem; margin-top:4px}
  @keyframes burst{0%{transform:translateX(-50%) scale(1);opacity:1}55%{transform:translateX(-50%) scale(1.28);opacity:1}100%{transform:translateX(-50%) scale(.4);opacity:0}}
  .rcard.burst{animation:burst .28s ease-in forwards}
  @keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-59%)}75%{transform:translateX(-41%)}}
  .rcard.miss{animation:shake .3s; border-color:var(--red)}
  .rain-opts{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px}
  @media(max-width:520px){.rain-opts{grid-template-columns:repeat(2,1fr)}}
  .ropt{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:10px 6px;
        cursor:pointer; display:flex; align-items:center; justify-content:center; min-height:64px;
        transition:transform .1s, background .1s}
  .ropt:hover{background:#fff; transform:translateY(-1px)}
  .ropt:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .ropt .iconbox{width:56px; height:56px; margin:0}
  .ropt .rnum-opt{font-family:var(--serif); font-weight:700; font-size:1.7rem; color:var(--ink)}
  .ropt .rword-opt{font-family:var(--serif); font-weight:600; font-size:1rem; text-align:center; line-height:1.15; color:var(--ink); padding:0 2px}
  .rcard .rword.solo{font-size:1.3rem; margin-top:0; padding:6px 2px}
  .ropt.correct{background:#e7f1ea; border-color:var(--good)}
  .ropt.wrong{background:#f6e3e0; border-color:var(--red)}
  .ropt[disabled]{cursor:default}

  /* ---------- intro / the code ---------- */
  .codenote{font-size:.9rem; color:var(--ink-soft); line-height:1.55; margin-bottom:14px; text-align:center}
  .codenote b{color:var(--ink)}
  .codelist{display:grid; gap:8px}
  .coderow{display:flex; align-items:center; gap:14px; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:10px 14px}
  .coderow .cd{font-family:var(--serif); font-weight:700; font-size:2rem; color:var(--accent-deep); width:38px; text-align:center; flex:none}
  .coderow .ctext{display:flex; flex-direction:column}
  .coderow .csnd{font-family:var(--serif); font-weight:700; font-size:1.15rem; color:var(--ink)}
  .coderow .chook{font-size:.8rem; color:var(--ink-soft); font-style:italic; margin-top:1px}
  .introbtns{display:flex; flex-direction:column; gap:10px; margin-top:16px}

  .flipcard{perspective:1200px; margin:8px auto 0; width:260px; max-width:100%}
  .flipinner{position:relative; transition:transform .5s; transform-style:preserve-3d; min-height:250px}
  .flipcard.flipped .flipinner{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px}
  .face.back{transform:rotateY(180deg)}

  .center{text-align:center}
  .muted{color:var(--ink-soft)}
  .mt{margin-top:16px}
  .results h2{font-family:var(--serif); text-align:center; font-size:1.7rem; margin-bottom:6px}
  .weaklist{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0}
  .weaktag{font-family:var(--serif); background:#f4e6c9; border:1px solid var(--accent-deep); color:var(--accent-deep); border-radius:999px; padding:4px 12px; font-size:.9rem}

  /* peek modal */
  .modal{position:fixed; inset:0; background:rgba(26,34,56,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:20}
  .modal.open{display:flex}
  .peek{background:var(--card); border:1.5px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:24px; width:260px; text-align:center; position:relative}
  .peek .num{font-family:var(--serif); font-weight:700; font-size:2rem; color:var(--accent-deep)}
  .peek .iconbox{width:120px;height:120px}
  .peek .theword{font-size:1.5rem}
  .peek-close{position:absolute; top:10px; right:12px; border:none; background:none; font-size:1.3rem; cursor:pointer; color:var(--ink-soft)}

  @media (prefers-reduced-motion: reduce){
    .flipinner{transition:none} .mode{transition:none} .opt{transition:none}
  }

  /* icon color classes (shared by all embedded SVGs) */
  svg{fill:none}
  .st{stroke:#2b3a67;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .stf{stroke:#2b3a67;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;fill:#fbf7ef}
  .thin{stroke:#2b3a67;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .inkfill{fill:#1a2238}
  .gold{fill:#e0a458}
  .goldst{stroke:#e0a458;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .goldthin{stroke:#e0a458;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .red{fill:#c0392b}
  .redst{stroke:#c0392b;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="brand"><span class="dot"></span> One Hundred Daisies</div>
    <div class="bar-right">
      <span class="pill" id="pill">0 / 101 mastered</span>
      <button class="btn-home" id="homeBtn" style="display:none" onclick="goHome()">&larr; Home</button>
    </div>
  </div>

  <!-- ============ HOME ============ -->
  <section id="home">
    <div class="hero">
      <h1>One Hundred Daisies</h1>
      <div class="sub">Train your 0&ndash;100 number pegs until every one is instant &mdash; both ways.</div>
      <div class="count" id="heroCount"></div>
    </div>

    <div class="scope">
      <label for="scopeSel">Practice&nbsp;set:</label>
      <select id="scopeSel" onchange="setScope(this.value)">
        <option value="all">All 0&ndash;100</option>
        <option value="0-9">0&ndash;9</option>
        <option value="10-19">10&ndash;19</option>
        <option value="20-29">20&ndash;29</option>
        <option value="30-39">30&ndash;39</option>
        <option value="40-49">40&ndash;49</option>
        <option value="50-59">50&ndash;59</option>
        <option value="60-69">60&ndash;69</option>
        <option value="70-79">70&ndash;79</option>
        <option value="80-89">80&ndash;89</option>
        <option value="90-100">90&ndash;100</option>
        <option value="weak">Weak spots only</option>
      </select>
    </div>

    <div class="modes">
      <button class="mode" onclick="startMode('intro')" style="grid-column:1/-1; border-color:var(--accent-deep)">
        <div class="step">START HERE</div><h3>The Code</h3>
        <p>The secret behind every peg: which letter-sounds stand for each digit 0&ndash;9. Learn this first &mdash; the whole system is built on it. Then quiz yourself.</p>
        <div class="how">Reference &middot; self-quiz</div>
      </button>
      <button class="mode" onclick="startLearn()">
        <div class="step">STEP 1</div><h3>Learn</h3>
        <p>Flip through the cards to study each number, picture, and word.</p>
        <div class="how">Flip &amp; self-rate</div>
      </button>
      <button class="mode" onclick="startMode('drill')">
        <div class="step">STEP 2</div><h3>Drill</h3>
        <p>Mixed practice, both directions. Reinforce until the links feel natural.</p>
        <div class="how">Multiple choice</div>
      </button>
      <button class="mode" onclick="startMode('diagnose')">
        <div class="step">STEP 3</div><h3>Diagnose</h3>
        <p>One pass over the set to find exactly which pegs are shaky.</p>
        <div class="how">Multiple choice &rarr; weak-spot map</div>
      </button>
      <button class="mode" onclick="startMode('grind')">
        <div class="step">STEP 4</div><h3>Grind</h3>
        <p>Drill only your weak pegs &mdash; by typing &mdash; until each is solid.</p>
        <div class="how">Type the answer</div>
      </button>
      <button class="mode" onclick="startMode('speed')" style="grid-column:1/-1">
        <div class="step">STEP 5</div><h3>Speed</h3>
        <p>Beat the clock. Rapid-fire recall to turn &ldquo;I can work it out&rdquo; into &ldquo;it&rsquo;s just there.&rdquo;</p>
        <div class="how">Timed &middot; multiple choice</div>
      </button>
      <button class="mode" onclick="startMode('rain')" style="grid-column:1/-1">
        <div class="step">STEP 6</div><h3>Daisy Rain &#127804;</h3>
        <p>Arcade mode. A word, number, or picture drifts down from the sky &mdash; tap its match before it lands. It speeds up as you go. Three lives.</p>
        <div class="how">Falling &middot; tap the match &middot; survive</div>
      </button>
    </div>

    <div class="prog">
      <h4>Your 101</h4>
      <div class="legend">
        <span><span class="sw" style="background:var(--card)"></span>unseen</span>
        <span><span class="sw" style="background:#f4e6c9"></span>learning</span>
        <span><span class="sw" style="background:var(--accent)"></span>mastered</span>
        <b class="muted">&nbsp;&mdash; tap any cell to peek</b>
      </div>
      <div class="grid101" id="grid101"></div>
    </div>
  </section>

  <!-- ============ PLAY ============ -->
  <section id="play" class="play">
    <div id="stageHost"></div>
  </section>

</div>

<div class="modal" id="modal" onclick="if(event.target===this)closePeek()">
  <div class="peek" id="peekBody"></div>
</div>

<script>
"use strict";
const PEGS = JSON.parse(document.getElementById('pegdata').textContent);
const byN = {}; PEGS.forEach(p=>byN[p.n]=p);

/* ---------- persistence ---------- */
const KEY='oneHundredDaisies.v1';
let stats = {};
function blank(){return {seen:0,correct:0,wrong:0,streak:0,best:null};}
function loadState(){
  try{const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){}
  return null;
}
function saveState(){ try{localStorage.setItem(KEY, JSON.stringify(stats));}catch(e){} }
(function initStats(){
  const saved = loadState() || {};
  for(let n=0;n<=100;n++){ stats[n] = Object.assign(blank(), saved[n]||{}); }
})();

const isMastered = n => stats[n].streak >= 3;
const isSeen = n => stats[n].seen > 0;
function masteredCount(){let c=0;for(let n=0;n<=100;n++) if(isMastered(n))c++;return c;}

/* ---------- scope ---------- */
let scope = allNums();
function allNums(){const a=[];for(let n=0;n<=100;n++)a.push(n);return a;}
function setScope(v){
  if(v==='all'){scope=allNums();}
  else if(v==='weak'){scope=allNums().filter(n=>!isMastered(n)); if(scope.length===0)scope=allNums();}
  else{const [a,b]=v.split('-').map(Number); scope=[]; for(let n=a;n<=b;n++)scope.push(n);}
}

/* ---------- helpers ---------- */
const rnd = n => Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(pool, k, exclude){
  const opts = pool.filter(n=>n!==exclude);
  return shuffle(opts).slice(0,k);
}
function weightedPick(pool){
  // bias toward weaker / less-seen pegs
  let total=0; const w=pool.map(n=>{
    const s=stats[n]; let x=1 + s.wrong*2 + (s.streak<3?2:0) + (s.seen===0?2:0);
    total+=x; return x;
  });
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}
function iconHTML(n){ return byN[n].svg; }
function record(n, ok, ms){
  const s=stats[n]; s.seen++;
  if(ok){ s.correct++; s.streak++; if(ms!=null && (s.best==null||ms<s.best)) s.best=ms; }
  else { s.wrong++; s.streak=0; }
  saveState(); refreshHeader();
}

/* ---------- header / grid ---------- */
function refreshHeader(){
  const m=masteredCount();
  document.getElementById('pill').textContent = m+' / 101 mastered';
  const hc=document.getElementById('heroCount');
  if(hc){
    if(m===101) hc.textContent='Every peg mastered. The daisies are yours.';
    else hc.textContent=m+' of 101 pegs mastered';
  }
}
function buildGrid(){
  const g=document.getElementById('grid101'); g.innerHTML='';
  for(let n=0;n<=100;n++){
    const c=document.createElement('button');
    c.className='cell'+(isMastered(n)?' mastered':(isSeen(n)?' seen':''));
    c.textContent=n; c.title=byN[n].word;
    c.onclick=()=>peek(n);
    g.appendChild(c);
  }
}
function peek(n){
  const p=byN[n];
  document.getElementById('peekBody').innerHTML =
    '<button class="peek-close" onclick="closePeek()">&times;</button>'+
    '<div class="num">'+two(n)+'</div>'+
    '<div class="iconbox">'+p.svg+'</div>'+
    '<div class="theword">'+p.word+'</div>'+
    (p.caption?'<div class="thecap">'+p.caption+'</div>':'');
  document.getElementById('modal').classList.add('open');
}
function closePeek(){document.getElementById('modal').classList.remove('open');}
function two(n){ return n<10 ? '0'+n : ''+n; }  // 0-9 -> 0X, 100 stays 100

/* ---------- navigation ---------- */
const homeEl=document.getElementById('home');
const playEl=document.getElementById('play');
const stageHost=document.getElementById('stageHost');
function goHome(){
  session=null; if(timerId){clearInterval(timerId);timerId=null;}
  playEl.classList.remove('active'); homeEl.style.display='';
  document.getElementById('homeBtn').style.display='none';
  buildGrid(); refreshHeader();
}
function enterPlay(){
  homeEl.style.display='none'; playEl.classList.add('active');
  document.getElementById('homeBtn').style.display='';
}

/* ============ LEARN (flip / self-rate) ============ */
function startLearn(){
  enterPlay();
  const deck = shuffle(scope.slice());
  let i=0, flipped=false;
  function render(){
    const n=deck[i], p=byN[n];
    flipped=false;
    stageHost.innerHTML =
      '<div class="scoreline">Card <b>'+(i+1)+'</b> of '+deck.length+'</div>'+
      '<div class="stage"><div class="inner">'+
        '<div class="flipcard" id="fc">'+
          '<div class="flipinner">'+
            '<div class="face front">'+
              '<div class="bignum">'+two(n)+'</div>'+
              '<div class="iconbox">'+p.svg+'</div>'+
              '<div class="muted" style="font-size:.8rem">tap to reveal</div>'+
            '</div>'+
            '<div class="face back">'+
              '<div class="theword">'+p.word+'</div>'+
              (p.caption?'<div class="thecap">'+p.caption+'</div>':'')+
              '<div class="bignum" style="font-size:2rem">'+two(n)+'</div>'+
            '</div>'+
          '</div>'+
        '</div>'+
        '<div class="feedback" id="fb"></div>'+
        '<div class="controls">'+
          '<button class="btn ghost" id="prev">&larr; Prev</button>'+
          '<div id="rate"></div>'+
          '<button class="btn ghost" id="next">Next &rarr;</button>'+
        '</div>'+
      '</div></div>';
    const fc=document.getElementById('fc');
    fc.onclick=()=>{ flipped=!flipped; fc.classList.toggle('flipped',flipped);
      document.getElementById('rate').innerHTML = flipped ?
        '<button class="btn ghost" onclick="event.stopPropagation()" id="miss">Missed</button> '+
        '<button class="btn gold" onclick="event.stopPropagation()" id="got">Got it</button>' : '';
      const g=document.getElementById('got'), m=document.getElementById('miss');
      if(g)g.onclick=(e)=>{e.stopPropagation();record(n,true,null);nextCard();};
      if(m)m.onclick=(e)=>{e.stopPropagation();record(n,false,null);nextCard();};
    };
    document.getElementById('prev').onclick=()=>{ i=(i-1+deck.length)%deck.length; render(); };
    document.getElementById('next').onclick=nextCard;
  }
  function nextCard(){ i=(i+1)%deck.length; render(); }
  render();
}

/* ============ shared quiz question ============ */
function makeQuestion(pool){
  const n = weightedPick(pool);
  const dir = Math.random()<0.5 ? 'n2w' : 'w2n'; // number->picture/word  OR  picture/word->number
  return {n, dir};
}
function renderMC(q, onPick){
  const p=byN[q.n];
  const distract = sample(allNums(), 3, q.n);
  const opts = shuffle([q.n, ...distract]);
  let head;
  if(q.dir==='n2w'){
    head = '<div class="prompt-label">Which picture is this number?</div>'+
           '<div class="bignum">'+two(q.n)+'</div>';
  }else{
    head = '<div class="prompt-label">What number is this?</div>'+
           '<div class="iconbox">'+p.svg+'</div>'+
           '<div class="theword">'+p.word+'</div>'+
           (p.caption?'<div class="thecap">'+p.caption+'</div>':'');
  }
  let optHTML = opts.map(o=>{
    if(q.dir==='n2w'){
      return '<button class="opt" data-n="'+o+'">'+
        '<div class="iconbox sm">'+byN[o].svg+'</div>'+
        '<div class="word-opt">'+byN[o].word+'</div></button>';
    } else {
      return '<button class="opt" data-n="'+o+'"><div class="num-opt">'+two(o)+'</div></button>';
    }
  }).join('');
  const qhead = stageHost.querySelector('#qhead');
  const box = stageHost.querySelector('#qbody');
  if(!qhead || !box) return;
  qhead.innerHTML = head;
  box.innerHTML = '<div class="options">'+optHTML+'</div><div class="feedback" id="fb"></div>';
  box.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const chosen=+b.dataset.n; const ok=chosen===q.n;
      box.querySelectorAll('.opt').forEach(x=>{
        x.setAttribute('disabled','');
        if(+x.dataset.n===q.n) x.classList.add('correct');
        else if(x===b) x.classList.add('wrong');
      });
      onPick(ok);
    };
  });
}

/* ============ DRILL (endless MC) ============ */
function startMode(mode){
  if(mode==='drill') return runDrill();
  if(mode==='speed') return runSpeed();
  if(mode==='diagnose') return runDiagnose();
  if(mode==='grind') return runGrind();
  if(mode==='rain') return runRain();
  if(mode==='intro') return runIntro();
}
function drillShell(title, sub){
  enterPlay();
  stageHost.innerHTML =
    '<div class="scoreline" id="score">'+sub+'</div>'+
    '<div class="stage"><div class="inner">'+
      '<div id="qhead"></div><div id="qbody"></div>'+
    '</div></div>';
}
let session=null;
function runDrill(){
  session={mode:'drill', asked:0, right:0};
  drillShell();
  document.getElementById('score').innerHTML='Drill &middot; <b>0</b> correct of <b>0</b>';
  nextDrill();
}
function nextDrill(){
  if(!session||session.mode!=='drill') return;
  const q=makeQuestion(scope);
  renderMC(q,(ok)=>{
    session.asked++; if(ok)session.right++;
    record(q.n, ok, null);
    document.getElementById('score').innerHTML='Drill &middot; <b>'+session.right+'</b> correct of <b>'+session.asked+'</b>';
    const fb=stageHost.querySelector('#fb');
    fb.textContent = ok?'Yes \u2014 '+byN[q.n].word+' is '+two(q.n):'It\u2019s '+two(q.n)+' \u2014 '+byN[q.n].word;
    fb.className='feedback '+(ok?'good':'bad');
    setTimeout(nextDrill, ok?700:1300);
  });
}

/* ============ SPEED (timed MC) ============ */
let timerId=null;
function runSpeed(){
  const DURATION=60;
  session={mode:'speed', score:0, left:DURATION};
  const best = +(localStorage.getItem('ohd.speedBest')||0);
  enterPlay();
  stageHost.innerHTML =
    '<div class="scoreline"><span class="timer" id="tmr">'+DURATION+'s</span>'+
      '<span>Score <b id="sc">0</b></span><span>Best <b>'+best+'</b></span></div>'+
    '<div class="timerbar"><i id="tbar"></i></div>'+
    '<div class="stage"><div class="inner"><div id="qhead"></div><div id="qbody"></div></div></div>';
  nextSpeed();
  const start=Date.now();
  timerId=setInterval(()=>{
    const elapsed=(Date.now()-start)/1000; session.left=Math.max(0,DURATION-elapsed);
    document.getElementById('tmr').textContent=Math.ceil(session.left)+'s';
    document.getElementById('tbar').style.width=(session.left/DURATION*100)+'%';
    if(session.left<=0){ clearInterval(timerId); timerId=null; endSpeed(best); }
  },200);
}
function nextSpeed(){
  if(!session||session.mode!=='speed') return;
  const q=makeQuestion(scope);
  renderMC(q,(ok)=>{
    if(ok)session.score++;
    record(q.n, ok, null);
    document.getElementById('sc').textContent=session.score;
    const fb=stageHost.querySelector('#fb');
    fb.textContent = ok?'\u2713':'\u2717 '+two(q.n);
    fb.className='feedback '+(ok?'good':'bad');
    setTimeout(()=>{ if(session&&session.left>0) nextSpeed(); }, ok?260:520);
  });
}
function endSpeed(prevBest){
  const s=session.score; const best=Math.max(prevBest,s);
  try{localStorage.setItem('ohd.speedBest',best);}catch(e){}
  const pb = s>prevBest && s>0;
  stageHost.innerHTML =
    '<div class="stage"><div class="inner results center">'+
      '<h2>Time!</h2>'+
      '<div class="bignum">'+s+'</div>'+
      '<div class="muted">correct in 60 seconds'+(pb?' &middot; new best!':'')+'</div>'+
      '<div class="mt"><button class="btn gold wide" onclick="runSpeed()">Go again</button></div>'+
      '<div class="mt"><button class="btn ghost wide" onclick="goHome()">Back home</button></div>'+
    '</div></div>';
}

/* ============ INTRO: THE CODE (major system) ============ */
const CODE=[
  {d:0, s:'S, Z',      h:'“Zero” starts with a Z sound.'},
  {d:1, s:'T, D, Th',  h:'t has one downstroke.'},
  {d:2, s:'N, Ng',     h:'n has two downstrokes.'},
  {d:3, s:'M',         h:'m has three downstrokes.'},
  {d:4, s:'R',         h:'“fouR” ends in R.'},
  {d:5, s:'L',         h:'L is the Roman numeral for 50; an open hand makes an L.'},
  {d:6, s:'J, Sh, Ch', h:'a handwritten J looks like a backwards 6.'},
  {d:7, s:'K, G',      h:'a K can be built from two 7s.'},
  {d:8, s:'F, V, Ph',  h:'a cursive f has two loops, like an 8.'},
  {d:9, s:'P, B',      h:'P is a mirror image of 9.'},
];
function runIntro(){
  session={mode:'intro'};
  enterPlay();
  const rows=CODE.map(c=>
    '<div class="coderow"><div class="cd">'+c.d+'</div>'+
    '<div class="ctext"><div class="csnd">'+c.s+'</div><div class="chook">'+c.h+'</div></div></div>'
  ).join('');
  stageHost.innerHTML=
    '<div class="codenote">Every peg word is built from this code: each <b>consonant sound</b> stands for a digit. '+
    '<b>Vowels</b> and the sounds <b>w, h, y</b> are free filler. So <b>“Nun”</b> (n&middot;n) is <b>2&thinsp;2</b>, and <b>“Rose”</b> (r&middot;s) is <b>4&thinsp;0</b>.</div>'+
    '<div class="codelist">'+rows+'</div>'+
    '<div class="introbtns">'+
      '<button class="btn gold wide" onclick="runIntroQuiz()">Quiz me &rarr;</button>'+
      '<button class="btn ghost wide" onclick="goHome()">Back home</button>'+
    '</div>';
}
function runIntroQuiz(){
  session={mode:'introquiz', i:0, score:0, order:shuffle(CODE.map(c=>c.d))};
  enterPlay();
  stageHost.innerHTML=
    '<div class="scoreline" id="score">The Code &middot; question <b>1</b> of 10</div>'+
    '<div class="stage"><div class="inner"><div id="qhead"></div><div id="qbody"></div></div></div>';
  introQ();
}
function introQ(){
  if(!session||session.mode!=='introquiz') return;
  if(session.i>=session.order.length) return endIntroQuiz();
  const d=session.order[session.i];
  const c=CODE.find(x=>x.d===d);
  const dir=Math.random()<0.5?'d2s':'s2d';
  const opts=shuffle([c, ...shuffle(CODE.filter(x=>x.d!==d)).slice(0,3)]);
  let head, optHTML;
  if(dir==='d2s'){
    head='<div class="prompt-label">Which sounds does this digit stand for?</div><div class="bignum">'+d+'</div>';
    optHTML=opts.map(o=>'<button class="opt" data-d="'+o.d+'"><div class="word-opt">'+o.s+'</div></button>').join('');
  }else{
    head='<div class="prompt-label">Which digit do these sounds stand for?</div><div class="theword">'+c.s+'</div>';
    optHTML=opts.map(o=>'<button class="opt" data-d="'+o.d+'"><div class="num-opt">'+o.d+'</div></button>').join('');
  }
  stageHost.querySelector('#qhead').innerHTML=head;
  const box=stageHost.querySelector('#qbody');
  box.innerHTML='<div class="options">'+optHTML+'</div><div class="feedback" id="fb"></div>';
  box.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      if(!session||session.mode!=='introquiz') return;
      const chosen=+b.dataset.d, ok=chosen===d;
      box.querySelectorAll('.opt').forEach(x=>{ x.setAttribute('disabled','');
        if(+x.dataset.d===d) x.classList.add('correct'); else if(x===b) x.classList.add('wrong'); });
      if(ok) session.score++;
      const fb=box.querySelector('#fb');
      fb.textContent=(ok?'✓ ':'✗ ')+d+' = '+c.s;
      fb.className='feedback '+(ok?'good':'bad');
      session.i++;
      const sc=document.getElementById('score');
      if(sc) sc.innerHTML='The Code &middot; question <b>'+Math.min(session.i+1,10)+'</b> of 10';
      setTimeout(introQ, ok?750:1250);
    };
  });
}
function endIntroQuiz(){
  const s=session.score;
  stageHost.innerHTML=
    '<div class="stage"><div class="inner results center">'+
      '<h2>'+(s===10?'Perfect — you know the code!':'The Code')+'</h2>'+
      '<div class="bignum">'+s+'/10</div>'+
      '<div class="muted">sounds matched to digits</div>'+
      '<div class="mt"><button class="btn gold wide" onclick="runIntroQuiz()">Quiz again</button></div>'+
      '<div class="mt"><button class="btn ghost wide" onclick="runIntro()">Review the code</button></div>'+
      '<div class="mt"><button class="btn ghost wide" onclick="goHome()">Back home</button></div>'+
    '</div></div>';
}

/* ============ DAISY RAIN (arcade / falling) ============ */
const RAIN_CHALLENGES=[
  {show:'num',    pick:'pic'},
  {show:'num',    pick:'word'},
  {show:'word',   pick:'num'},
  {show:'word',   pick:'pic'},
  {show:'pic',    pick:'num'},
  {show:'pic',    pick:'word'},
  {show:'picword',pick:'num'},
];
function rainCardHTML(p, show){
  if(show==='num')  return '<div class="rnum">'+two(p.n)+'</div>';
  if(show==='word') return '<div class="rword solo">'+p.word+'</div>';
  if(show==='pic')  return '<div class="ricon">'+p.svg+'</div>';
  return '<div class="ricon">'+p.svg+'</div><div class="rword">'+p.word+'</div>'; // picword
}
function rainOptHTML(o, pick){
  if(pick==='pic')  return '<button class="ropt" data-n="'+o+'"><div class="iconbox">'+byN[o].svg+'</div></button>';
  if(pick==='word') return '<button class="ropt" data-n="'+o+'"><span class="rword-opt">'+byN[o].word+'</span></button>';
  return '<button class="ropt" data-n="'+o+'"><span class="rnum-opt">'+two(o)+'</span></button>'; // num
}
function runRain(){
  const best=+(localStorage.getItem('ohd.rainBest')||0);
  session={mode:'rain', score:0, lives:3, fallMs:7000, y:0, q:null, answered:false, over:false};
  enterPlay();
  stageHost.innerHTML =
    '<div class="scoreline"><span>Score <b id="rsc">0</b></span>'+
      '<span>Best <b>'+best+'</b></span>'+
      '<span class="rlives" id="rlives"></span></div>'+
    '<div class="stage rain"><div class="sky" id="sky">'+
      '<div class="rcard" id="rcard"></div><div class="ground"></div></div></div>'+
    '<div class="rain-opts" id="ropts"></div>'+
    '<div class="feedback" id="fb"></div>';
  updateRainHud();
  spawnRain();
  const TICK=25;
  timerId=setInterval(()=>{
    if(!session||session.mode!=='rain'||session.answered||session.over) return;
    const sky=document.getElementById('sky'), card=document.getElementById('rcard');
    if(!sky||!card) return;
    const travel=Math.max(0, sky.clientHeight-card.offsetHeight);
    session.y=Math.min(travel, session.y + travel*TICK/session.fallMs);
    card.style.top=session.y+'px';
    if(session.y>=travel) landRain();
  }, TICK);
}
function updateRainHud(){
  const sc=document.getElementById('rsc'); if(sc) sc.textContent=session.score;
  const lv=document.getElementById('rlives'); if(lv){
    let h=''; for(let i=0;i<3;i++) h+='<span class="rlife'+(i<session.lives?'':' spent')+'">🌼</span>';
    lv.innerHTML=h;
  }
}
function spawnRain(){
  if(!session||session.over) return;
  session.answered=false; session.y=0;
  const n=weightedPick(scope);
  const ch=RAIN_CHALLENGES[rnd(RAIN_CHALLENGES.length)];
  session.q={n, show:ch.show, pick:ch.pick};
  const p=byN[n];
  const opts=shuffle([n, ...sample(allNums(),3,n)]);
  const card=document.getElementById('rcard');
  card.className='rcard'; card.style.top='0px';
  card.innerHTML=rainCardHTML(p, ch.show);
  const ropts=document.getElementById('ropts');
  ropts.innerHTML=opts.map(o=>rainOptHTML(o, ch.pick)).join('');
  ropts.querySelectorAll('.ropt').forEach(b=>{ b.onclick=()=>answerRain(+b.dataset.n, b); });
}
function answerRain(chosen, btn){
  if(!session||session.answered||session.over) return;
  session.answered=true;
  const q=session.q, ok=chosen===q.n;
  record(q.n, ok, null);
  const card=document.getElementById('rcard');
  const fb=document.getElementById('fb');
  if(ok){
    session.score++; updateRainHud();
    if(card) card.classList.add('burst');
    if(fb){ fb.textContent='✓ '+byN[q.n].word+' is '+two(q.n); fb.className='feedback good'; }
    session.fallMs=Math.max(3200, session.fallMs*0.96);
    setTimeout(()=>{ if(session&&!session.over) spawnRain(); }, 300);
  } else {
    if(card) card.classList.add('miss');
    const ropts=document.getElementById('ropts');
    if(ropts) ropts.querySelectorAll('.ropt').forEach(x=>{
      x.setAttribute('disabled','');
      if(+x.dataset.n===q.n) x.classList.add('correct');
      else if(x===btn) x.classList.add('wrong');
    });
    loseLife(two(q.n)+' — '+byN[q.n].word);
  }
}
function landRain(){
  if(!session||session.answered||session.over) return;
  session.answered=true;
  const q=session.q;
  record(q.n, false, null);
  const card=document.getElementById('rcard'); if(card) card.classList.add('miss');
  loseLife('missed — '+two(q.n)+' is '+byN[q.n].word);
}
function loseLife(msg){
  session.lives--; updateRainHud();
  const fb=document.getElementById('fb');
  if(fb){ fb.textContent='✗ '+msg; fb.className='feedback bad'; }
  const gap = session.lives<=0 ? 900 : 850;
  setTimeout(()=>{
    if(!session) return;
    if(session.lives<=0) endRain(); else if(!session.over) spawnRain();
  }, gap);
}
function endRain(){
  if(!session) return;
  session.over=true;
  if(timerId){clearInterval(timerId); timerId=null;}
  const s=session.score;
  const prevBest=+(localStorage.getItem('ohd.rainBest')||0);
  const best=Math.max(prevBest,s);
  try{localStorage.setItem('ohd.rainBest',best);}catch(e){}
  const pb=s>prevBest && s>0;
  stageHost.innerHTML =
    '<div class="stage"><div class="inner results center">'+
      '<h2>Out of daisies!</h2>'+
      '<div class="bignum">'+s+'</div>'+
      '<div class="muted">caught before landing'+(pb?' &middot; new best!':'')+'</div>'+
      '<div class="mt"><button class="btn gold wide" onclick="runRain()">Go again</button></div>'+
      '<div class="mt"><button class="btn ghost wide" onclick="goHome()">Back home</button></div>'+
    '</div></div>';
}

/* ============ DIAGNOSE (one pass -> map) ============ */
function runDiagnose(){
  const queue=shuffle(scope.slice());
  session={mode:'diagnose', queue, i:0, results:{}};
  drillShell();
  stepDiagnose();
}
function stepDiagnose(){
  if(!session||session.mode!=='diagnose') return;
  if(session.i>=session.queue.length) return endDiagnose();
  const n=session.queue[session.i];
  document.getElementById('score').innerHTML='Diagnose &middot; <b>'+(session.i+1)+'</b> of '+session.queue.length;
  const q={n, dir: Math.random()<0.5?'n2w':'w2n'};
  renderMC(q,(ok)=>{
    session.results[n]=ok; record(n, ok, null);
    const fb=stageHost.querySelector('#fb');
    fb.textContent = ok?'\u2713':'It\u2019s '+two(n)+' \u2014 '+byN[n].word;
    fb.className='feedback '+(ok?'good':'bad');
    session.i++;
    setTimeout(stepDiagnose, ok?550:1100);
  });
}
function endDiagnose(){
  const weak = Object.keys(session.results).filter(n=>!session.results[n]).map(Number).sort((a,b)=>a-b);
  let grid='<div class="grid101">';
  session.queue.slice().sort((a,b)=>a-b).forEach(n=>{
    const cls = session.results[n] ? 'mastered':'';
    grid += '<button class="cell '+cls+(session.results[n]?'':' ')+'" style="'+(session.results[n]?'':'background:#f6e3e0;border-color:#c0392b;color:#c0392b')+'" onclick="peek('+n+')">'+n+'</button>';
  });
  grid+='</div>';
  const weakTags = weak.length? weak.map(n=>'<span class="weaktag">'+two(n)+' '+byN[n].word+'</span>').join('') :
    '<div class="muted">No misses this pass \u2014 beautifully solid.</div>';
  stageHost.innerHTML =
    '<div class="stage"><div class="inner results">'+
      '<h2>Diagnosis</h2>'+
      '<div class="center muted">'+ (session.queue.length-weak.length) +' of '+session.queue.length+' correct</div>'+
      '<div class="weaklist">'+weakTags+'</div>'+
      grid+
      (weak.length?'<div class="mt"><button class="btn gold wide" onclick="grindThese(['+weak.join(',')+'])">Grind these '+weak.length+'</button></div>':'')+
      '<div class="mt"><button class="btn ghost wide" onclick="goHome()">Back home</button></div>'+
    '</div></div>';
}

/* ============ GRIND (type the answer) ============ */
function runGrind(){
  const pool = scope.filter(n=>!isMastered(n));
  grindThese(pool);
}
function grindThese(pool){
  if(!pool || pool.length===0){
    enterPlay();
    stageHost.innerHTML='<div class="stage"><div class="inner results center"><h2>Nothing to grind</h2>'+
      '<div class="muted">Every peg in this set is already solid.</div>'+
      '<div class="mt"><button class="btn ghost wide" onclick="goHome()">Back home</button></div></div></div>';
    return;
  }
  enterPlay();
  // local mastery: need 2 correct in a row this session to clear from the pool
  session={mode:'grind', pool:shuffle(pool.slice()), need:{}, cleared:0, total:pool.length};
  pool.forEach(n=>session.need[n]=2);
  stageHost.innerHTML=
    '<div class="scoreline" id="score"></div>'+
    '<div class="stage"><div class="inner"><div id="qhead"></div><div id="qbody"></div></div></div>';
  nextGrind();
}
function nextGrind(){
  if(!session||session.mode!=='grind') return;
  const remaining = session.pool.filter(n=>session.need[n]>0);
  if(remaining.length===0) return endGrind();
  document.getElementById('score').innerHTML='Grind &middot; <b>'+(session.total-remaining.length)+'</b> of '+session.total+' cleared';
  const n = remaining[rnd(remaining.length)];
  const p=byN[n];
  const dir = Math.random()<0.5?'n2w':'w2n';
  let head;
  if(dir==='n2w'){
    head='<div class="prompt-label">Type the word for this number</div><div class="bignum">'+two(n)+'</div>';
  }else{
    head='<div class="prompt-label">Type the number for this picture</div>'+
      '<div class="iconbox">'+p.svg+'</div>';
  }
  stageHost.querySelector('#qhead').innerHTML=head;
  stageHost.querySelector('#qbody').innerHTML=
    '<div class="typerow"><input id="ans" autocomplete="off" autocapitalize="off" '+
      (dir==='w2n'?'inputmode="numeric" ':'')+'placeholder="'+(dir==='n2w'?'the word\u2026':'the number\u2026')+'"/>'+
      '<button class="btn" id="go">Check</button></div>'+
    '<div class="feedback" id="fb"></div>';
  const inp=document.getElementById('ans'); inp.focus();
  function submit(){
    const val=inp.value.trim();
    if(!val) return;
    let ok;
    if(dir==='n2w') ok = val.toLowerCase()===p.word.toLowerCase();
    else ok = (val.replace(/\D/g,'')!=='' && parseInt(val,10)===n);
    const fb=document.getElementById('fb');
    if(ok){
      session.need[n]--; record(n,true,null);
      fb.textContent = session.need[n]>0 ? '\u2713 once more to clear it' : '\u2713 cleared!';
      fb.className='feedback good';
    }else{
      session.need[n]=2; record(n,false,null);
      fb.textContent = (dir==='n2w'? 'It\u2019s "'+p.word+'"' : 'It\u2019s '+two(n)+' \u2014 '+p.word);
      fb.className='feedback bad';
    }
    setTimeout(nextGrind, ok?650:1500);
  }
  document.getElementById('go').onclick=submit;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
}
function endGrind(){
  stageHost.innerHTML='<div class="stage"><div class="inner results center">'+
    '<h2>All cleared</h2>'+
    '<div class="iconbox">'+byN[100].svg+'</div>'+
    '<div class="muted">Every weak peg in this run is solid now.</div>'+
    '<div class="mt"><button class="btn ghost wide" onclick="goHome()">Back home</button></div></div></div>';
}

/* ---------- boot ---------- */
buildGrid(); refreshHeader();
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(document.getElementById('modal').classList.contains('open'))closePeek(); }});
</script>
</body>
</html>
