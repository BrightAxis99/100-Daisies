<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>One Hundred Daisies</title>
<style>
  :root{
    --ink:#1a2238; --ink-soft:#48506b; --line:#2b3a67;
    --accent:#e0a458; --accent-deep:#c98a3c;
    --card:#fbf7ef; --paper:#ece3d2; --paper-2:#e4d9c2; --rule:#d8cdb6;
    --red:#c0392b; --good:#3f7d5a; --bloom:#f2c14e; --leaf:#5a9367; --leaf-deep:#437150; --coral:#e8705a;
    --shadow:0 14px 32px -22px rgba(26,34,56,.55);
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:linear-gradient(180deg, #cfe8f5 0%, #dcebd0 52%, #e6eed6 100%) fixed;
    color:var(--ink); font-family:var(--sans);
    min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:16px 14px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%; max-width:720px; margin:0 auto}

  /* top bar */
  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; min-height:40px}
  .brand{font-family:var(--serif); font-weight:700; font-size:1.1rem; display:flex; align-items:center; gap:8px}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #f3ecdc}
  .bar-right{display:flex; align-items:center; gap:8px}
  .flame{font-family:var(--serif); font-size:.85rem; color:var(--accent-deep); background:var(--card); border:1px solid var(--rule); border-radius:999px; padding:5px 11px; white-space:nowrap}
  .btn-home{font-family:var(--sans); font-size:.85rem; border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:7px 12px; cursor:pointer; display:none}
  .btn-home:hover{background:#fff}

  /* xp bar */
  .xpwrap{background:var(--card); border:1.5px solid var(--rule); border-radius:14px; padding:10px 14px; margin-bottom:14px}
  .xprow{display:flex; align-items:center; justify-content:space-between; font-family:var(--serif); font-size:.9rem; margin-bottom:6px}
  .xprow .lvl{font-weight:700}
  .xprow .meadowpct{color:var(--accent-deep); font-weight:700}
  .xpbar{height:9px; background:var(--paper-2); border-radius:99px; overflow:hidden}
  .xpbar>i{display:block; height:100%; background:linear-gradient(90deg,var(--leaf),var(--accent-deep)); width:0%; transition:width .5s}

  /* hero */
  .hero{text-align:center; margin:6px 0 16px}
  .hero h1{font-family:var(--serif); font-size:2.15rem; font-weight:700; line-height:1.05}
  .hero .sub{color:var(--ink-soft); margin-top:6px; font-size:.95rem}

  .daily{width:100%; margin:0 0 18px; background:linear-gradient(180deg,#fff8ea,#f6ead0); border:1.5px solid var(--accent-deep); border-radius:16px; padding:16px 18px; cursor:pointer; text-align:left; box-shadow:var(--shadow); display:flex; align-items:center; gap:14px}
  .daily:hover{background:#fff}
  .daily .big{font-size:1.8rem}
  .daily h3{font-family:var(--serif); font-size:1.25rem}
  .daily p{font-size:.84rem; color:var(--ink-soft); margin-top:2px}

  .scope{display:flex; align-items:center; gap:10px; justify-content:center; margin:2px 0 16px; flex-wrap:wrap}
  .scope label{font-size:.85rem; color:var(--ink-soft)}
  .scope select{font-family:var(--sans); font-size:.9rem; padding:7px 10px; border:1.5px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink)}

  .modes{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  @media(max-width:520px){.modes{grid-template-columns:1fr}}
  .mode{text-align:left; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:16px 16px 14px; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s, box-shadow .12s}
  .mode:hover{transform:translateY(-2px)}
  .mode:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .mode .step{font-family:var(--serif); font-size:.78rem; color:var(--accent-deep); font-weight:700; letter-spacing:.12em}
  .mode h3{font-family:var(--serif); font-size:1.22rem; margin:3px 0 5px}
  .mode p{font-size:.83rem; color:var(--ink-soft); line-height:1.4}
  .mode .how{margin-top:8px; font-size:.72rem; color:var(--ink-soft); font-style:italic}

  /* meadow */
  .prog{margin-top:22px}
  .prog h4{font-family:var(--serif); font-size:1.05rem; margin-bottom:2px}
  .prog .legend{font-size:.72rem; color:var(--ink-soft); margin:6px 0 10px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
  .sw{display:inline-block; width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:4px;border:1px solid var(--rule)}
  .grid101{display:grid; grid-template-columns:repeat(auto-fill,minmax(30px,1fr)); gap:5px}
  .cell{position:relative; aspect-ratio:1; border-radius:7px; border:1px solid var(--rule); background:#f4ede0; font-family:var(--serif); font-size:.6rem; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden}
  .cell.t1{background:#cfe6c5}
  .cell.t2{background:#a9d3a0}
  .cell.t3{background:#6fae74; color:#fff}
  .cell.t4{background:var(--bloom); color:#4a3410; border-color:var(--accent-deep); font-weight:700}
  .cell.due::after{content:""; position:absolute; top:2px; right:2px; width:6px;height:6px; border-radius:50%; background:var(--red)}
  .cell .bl{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.9rem; color:#fff; opacity:.85}
  .cell:hover{outline:2px solid var(--accent)}

  /* play surface */
  .play{display:none}
  .play.active{display:block}
  .stage{background:var(--card); border:1.5px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:20px; position:relative}
  .stage::before{content:"";position:absolute;inset:6px;border:1px solid var(--rule);border-radius:13px;pointer-events:none}
  .stage .inner{position:relative}
  .topline{display:flex; align-items:center; justify-content:space-between; font-family:var(--serif); color:var(--ink-soft); font-size:.9rem; margin-bottom:6px; gap:10px}
  .topline b{color:var(--ink)}
  .hearts{letter-spacing:2px; font-size:1.05rem; color:var(--coral)}
  .progbar{height:7px; background:var(--paper-2); border-radius:99px; overflow:hidden; margin-bottom:10px}
  .progbar>i{display:block;height:100%;background:var(--accent);width:0%;transition:width .25s}

  .prompt-label{text-align:center; font-size:.78rem; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-soft)}
  .bignum{font-family:var(--serif); font-weight:700; font-size:4rem; color:var(--accent-deep); text-align:center; line-height:1; margin:6px 0}
  .iconbox{width:140px;height:140px;margin:6px auto; display:flex; align-items:center; justify-content:center}
  .iconbox svg{width:100%;height:100%}
  .iconbox.sm{width:70px;height:70px;margin:0 auto}
  .theword{font-family:var(--serif); font-weight:600; font-size:1.8rem; text-align:center}
  .thecap{text-align:center; font-style:italic; color:var(--ink-soft); font-size:.8rem; margin-top:2px}

  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px}
  .opt{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:14px 10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; font-family:var(--serif); transition:transform .1s, background .1s}
  .opt:hover{background:#fff; transform:translateY(-1px)}
  .opt:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .opt .num-opt{font-size:1.9rem; font-weight:700; color:var(--ink)}
  .opt .word-opt{font-size:1rem}
  .opt.correct{background:#e7f1ea; border-color:var(--good)}
  .opt.wrong{background:#f6e3e0; border-color:var(--red)}
  .opt[disabled]{cursor:default}

  .typerow{display:flex; gap:10px; margin-top:18px}
  .typerow input{flex:1; font-family:var(--serif); font-size:1.4rem; text-align:center; padding:12px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink)}
  .typerow input:focus{outline:3px solid var(--accent)}
  .btn{font-family:var(--sans); font-weight:600; border:1.5px solid var(--line); background:var(--ink); color:#fdf8ee; border-radius:12px; padding:0 20px; cursor:pointer; font-size:1rem; min-height:46px}
  .btn:hover{background:#0f1730}
  .btn.ghost{background:var(--card); color:var(--ink)}
  .btn.ghost:hover{background:#fff}
  .btn.gold{background:var(--accent); color:#3a2c10; border-color:var(--accent-deep)}
  .btn.wide{width:100%; padding:14px}

  .feedback{text-align:center; min-height:26px; margin-top:12px; font-family:var(--serif); font-size:1.02rem}
  .feedback.good{color:var(--good)} .feedback.bad{color:var(--red)}
  .combo{position:absolute; top:8px; right:10px; font-family:var(--serif); font-weight:700; color:var(--accent-deep); font-size:1.1rem; opacity:0; transition:opacity .2s, transform .2s}
  .combo.show{opacity:1; transform:translateY(-2px)}

  .controls{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:14px}

  /* flip */
  .flipcard{perspective:1200px; margin:6px auto 0; width:260px; max-width:100%}
  .flipinner{position:relative; transition:transform .5s; transform-style:preserve-3d; min-height:250px}
  .flipcard.flipped .flipinner{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px}
  .face.back{transform:rotateY(180deg)}

  /* results / scorecard */
  .results h2{font-family:var(--serif); text-align:center; font-size:1.7rem; margin-bottom:2px}
  .results .sub{text-align:center; color:var(--ink-soft); margin-bottom:14px}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 14px}
  .stat{background:#fff8ea; border:1px solid var(--rule); border-radius:12px; padding:12px; text-align:center}
  .stat .v{font-family:var(--serif); font-weight:700; font-size:1.6rem; color:var(--accent-deep)}
  .stat .k{font-size:.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.1em}
  .bloomrow{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:10px 0}
  .bloomtag{font-family:var(--serif); background:var(--bloom); border:1px solid var(--accent-deep); color:#4a3410; border-radius:999px; padding:4px 12px; font-size:.9rem}
  .weaktag{font-family:var(--serif); background:#f4e6c9; border:1px solid var(--accent-deep); color:var(--accent-deep); border-radius:999px; padding:4px 12px; font-size:.9rem}
  .center{text-align:center} .muted{color:var(--ink-soft)} .mt{margin-top:12px}

  /* daisy rain */
  #rainStage{position:relative; height:60vh; min-height:380px; max-height:560px; overflow:hidden; border-radius:14px; background:linear-gradient(180deg,#d6ebf5 0%,#e6efd6 100%); border:1px solid var(--rule)}
  .faller{position:absolute; top:-90px; display:flex; flex-direction:column; align-items:center; gap:2px; will-change:transform}
  .faller .fnum{font-family:var(--serif); font-weight:700; font-size:2.4rem; color:var(--accent-deep)}
  .faller .ficon{width:74px;height:74px}
  .faller .fword{font-family:var(--serif); font-weight:600; font-size:1.3rem}
  .rainchoices{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px}
  .rchoice{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:10px 4px; cursor:pointer; font-family:var(--serif); display:flex; flex-direction:column; align-items:center; gap:2px}
  .rchoice:hover{background:#fff}
  .rchoice .rn{font-size:1.5rem; font-weight:700}
  .rchoice .riconbox{width:52px;height:52px}
  .rainhud{display:flex; align-items:center; justify-content:space-between; font-family:var(--serif); margin-bottom:8px}
  .diffrow{display:flex; gap:8px; justify-content:center; margin:14px 0}
  .diffbtn{font-family:var(--sans); border:1.5px solid var(--line); background:var(--card); border-radius:12px; padding:10px 16px; cursor:pointer}
  .diffbtn.sel{background:var(--accent); border-color:var(--accent-deep); color:#3a2c10; font-weight:700}

  .bloomflash{position:fixed; inset:0; pointer-events:none; display:flex; align-items:center; justify-content:center; z-index:30}
  .bloomflash .b{font-size:5rem; opacity:0; transform:scale(.4)}
  @keyframes pop{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
  .bloomflash.go .b{animation:pop 1.1s ease forwards}

  /* peek modal */
  .modal{position:fixed; inset:0; background:rgba(26,34,56,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:20}
  .modal.open{display:flex}
  .peek{background:var(--card); border:1.5px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:22px; width:270px; text-align:center; position:relative}
  .peek .num{font-family:var(--serif); font-weight:700; font-size:2rem; color:var(--accent-deep)}
  .peek .iconbox{width:120px;height:120px}
  .peek .tier{font-size:.78rem; color:var(--ink-soft); margin-top:6px; text-transform:uppercase; letter-spacing:.1em}
  .peek-close{position:absolute; top:10px; right:12px; border:none; background:none; font-size:1.3rem; cursor:pointer; color:var(--ink-soft)}
  .peek.t0{background:#f4ede0}
  .peek.t1{background:#cfe6c5}
  .peek.t2{background:#a9d3a0}
  .peek.t3{background:#6fae74; border-color:#437150}
  .peek.t3 .num,.peek.t3 .theword,.peek.t3 .thecap{color:#fff}
  .peek.t4{background:var(--bloom); border-color:var(--accent-deep)}
  .peek.t4 .num{color:#4a3410}
  .peek.due::after{content:""; position:absolute; top:12px; left:14px; width:9px; height:9px; border-radius:50%; background:var(--red)}
  /* ---------- the code (intro lesson) ---------- */
  .codenote{font-size:.9rem; color:var(--ink-soft); line-height:1.55; margin-bottom:14px; text-align:center}
  .codenote b{color:var(--ink)}
  .codelist{display:grid; gap:8px}
  .coderow{display:flex; align-items:center; gap:14px; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:10px 14px}
  .coderow .cd{font-family:var(--serif); font-weight:700; font-size:2rem; color:var(--accent-deep); width:38px; text-align:center; flex:none}
  .coderow .ctext{display:flex; flex-direction:column}
  .coderow .csnd{font-family:var(--serif); font-weight:700; font-size:1.15rem; color:var(--ink)}
  .coderow .chook{font-size:.8rem; color:var(--ink-soft); font-style:italic; margin-top:1px}
  .introbtns{display:flex; flex-direction:column; gap:10px; margin-top:16px}

  .settingsrow{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:18px; font-size:.82rem; color:var(--ink-soft)}
  .settingsrow button{font-family:var(--sans); border:1px solid var(--rule); background:var(--card); border-radius:8px; padding:5px 10px; cursor:pointer; color:var(--ink)}

  @media (prefers-reduced-motion: reduce){
    .flipinner,.mode,.opt{transition:none}
    .bloomflash.go .b{animation-duration:.5s}
  }
  svg{fill:none}
  .st{stroke:#2b3a67;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
  .stf{stroke:#2b3a67;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;fill:#fbf7ef}
  .thin{stroke:#2b3a67;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .inkfill{fill:#1a2238}
  .gold{fill:#e0a458}
  .goldst{stroke:#e0a458;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .goldthin{stroke:#e0a458;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .red{fill:#c0392b}
  .redst{stroke:#c0392b;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand"><span class="dot"></span> One Hundred Daisies</div>
    <div class="bar-right">
      <span class="flame" id="flame">&#128293; 0</span>
      <button class="btn-home" id="homeBtn" onclick="goHome()">&larr; Home</button>
    </div>
  </div>

  <div class="xpwrap" id="xpwrap">
    <div class="xprow"><span class="lvl" id="lvlLabel">Level 1</span><span class="meadowpct" id="meadowPct">Meadow 0%</span></div>
    <div class="xpbar"><i id="xpfill"></i></div>
  </div>

  <section id="home">
    <div class="hero">
      <h1>One Hundred Daisies</h1>
      <div class="sub">Grow the meadow &mdash; bloom all 100 pegs by learning them for real, both ways.</div>
    </div>

    <button class="daily" onclick="startDaily()">
      <span class="big">&#127807;</span>
      <span><h3>Daily Practice</h3><p id="dailyDesc">A quick 15-question round the game picks for you &mdash; pegs due for review, plus a few new ones.</p></span>
    </button>

    <div class="scope">
      <label for="scopeSel">Practice&nbsp;set:</label>
      <select id="scopeSel" onchange="setScope(this.value)">
        <option value="all">All 0&ndash;100</option>
        <option value="0-9">0&ndash;9</option><option value="10-19">10&ndash;19</option>
        <option value="20-29">20&ndash;29</option><option value="30-39">30&ndash;39</option>
        <option value="40-49">40&ndash;49</option><option value="50-59">50&ndash;59</option>
        <option value="60-69">60&ndash;69</option><option value="70-79">70&ndash;79</option>
        <option value="80-89">80&ndash;89</option><option value="90-100">90&ndash;100</option>
        <option value="due">Reviews due</option><option value="weak">Weak spots</option>
      </select>
    </div>

    <div class="modes">
      <button class="mode" onclick="runIntro()" style="grid-column:1/-1; border-color:var(--accent-deep)"><div class="step">START HERE</div><h3>The Code</h3><p>What this is all about &mdash; the map of which letter-sounds make each digit 0&ndash;9. Learn this first; every peg is built on it.</p><div class="how">Reference &middot; self-quiz</div></button>
      <button class="mode" onclick="startLearn()"><div class="step">LEARN</div><h3>Study</h3><p>Flip through the cards &mdash; number, picture, word.</p><div class="how">Flip &amp; self-rate</div></button>
      <button class="mode" onclick="startRound('drill')"><div class="step">DRILL</div><h3>Practice Round</h3><p>15 questions, both directions, then a scorecard.</p><div class="how">Multiple choice &middot; combo</div></button>
      <button class="mode" onclick="startRound('diagnose')"><div class="step">DIAGNOSE</div><h3>Check-up</h3><p>One pass to map exactly which pegs are shaky.</p><div class="how">MC &rarr; weak-spot map</div></button>
      <button class="mode" onclick="startRound('grind')"><div class="step">GRIND</div><h3>Weak Pegs</h3><p>Type-the-answer drilling on just your weak pegs.</p><div class="how">Type &middot; clear the set</div></button>
      <button class="mode" onclick="startRound('speed')"><div class="step">SPEED</div><h3>Beat the Clock</h3><p>60 seconds of rapid recall. Race your best.</p><div class="how">Timed &middot; combo</div></button>
      <button class="mode" onclick="rainIntro()"><div class="step">ARCADE</div><h3>Daisy Rain &#127804;</h3><p>Pegs drift down &mdash; tap the match before they land. Starts gentle, 3 lives.</p><div class="how">Falling &middot; survive</div></button>
    </div>

    <div class="prog">
      <h4>Your meadow</h4>
      <div class="legend">
        <span><span class="sw" style="background:#f4ede0"></span>seed</span>
        <span><span class="sw" style="background:#a9d3a0"></span>growing</span>
        <span><span class="sw" style="background:#6fae74"></span>solid</span>
        <span><span class="sw" style="background:var(--bloom)"></span>bloomed</span>
        <span><span class="sw" style="background:var(--red)"></span>review due</span>
        <span class="muted">&mdash; tap to peek</span>
      </div>
      <div class="grid101" id="grid101"></div>
    </div>

    <div class="settingsrow">
      <span>Sound <button id="soundBtn" onclick="toggleSound()">on</button></span>
      <span><button onclick="if(confirm('Reset all progress? This cannot be undone.')){resetAll()}">Reset progress</button></span>
    </div>
  </section>

  <section id="play" class="play"><div id="stageHost"></div></section>
</div>

<script>
"use strict";
const PEGS = JSON.parse(document.getElementById('pegdata').textContent);
const byN = {}; PEGS.forEach(p=>byN[p.n]=p);
const DAY = 86400000;
const today = () => Math.floor(Date.now()/DAY);
const SPEED_GOAL = 3500;            // ms: "fast" recall threshold
const SR = [1,3,7,16,35,70];       // spaced-review intervals (days)

/* ---------- state ---------- */
const KEY='ohd.v2';
let S = null;
function blankPeg(){return {c:{n2w:0,w2n:0}, ok:{n2w:0,w2n:0}, at:{n2w:0,w2n:0}, ema:null, reps:0, due:0, days:[]};}
function freshState(){
  const pegs={}; for(let n=0;n<=100;n++) pegs[n]=blankPeg();
  return {pegs, xp:0, streak:0, lastDay:0, best:{speed:0,rain:0}, sound:true};
}
function load(){ try{const s=localStorage.getItem(KEY); if(s)return JSON.parse(s);}catch(e){} return null; }
function save(){ try{localStorage.setItem(KEY, JSON.stringify(S));}catch(e){} }
S = load() || freshState();
// migrate any missing fields
for(let n=0;n<=100;n++){ if(!S.pegs[n]) S.pegs[n]=blankPeg(); }
if(S.sound===undefined) S.sound=true;

/* ---------- daily streak ---------- */
(function streakCheck(){
  const t=today();
  if(S.lastDay===0){ /* first ever */ }
  else if(t - S.lastDay === 1){ /* consecutive handled when they play */ }
  else if(t - S.lastDay > 1){ S.streak = 0; }  // missed a day -> reset
  save();
})();
function markPlayedToday(){
  const t=today();
  if(S.lastDay!==t){
    if(t - S.lastDay === 1 || S.lastDay===0) S.streak = (S.streak||0)+1;
    else S.streak = 1;
    S.lastDay = t; save(); refreshHeader();
  }
}

/* ---------- mastery tiers ---------- */
// 0 seed, 1 sprout, 2 learning, 3 solid, 4 bloomed
function tier(n){
  const p=S.pegs[n];
  const bothOnce = p.ok.n2w>0 && p.ok.w2n>0;
  const anyOnce = p.ok.n2w>0 || p.ok.w2n>0;
  const fast = p.ema!=null && p.ema < SPEED_GOAL;
  const multiDay = p.days.length >= 2;
  if(bothOnce && p.c.n2w>=2 && p.c.w2n>=2 && p.reps>=3 && multiDay && fast) return 4;
  if(bothOnce && (p.c.n2w>=1 && p.c.w2n>=1) && p.reps>=2) return 3;
  if(bothOnce) return 2;
  if(anyOnce) return 1;
  return 0;
}
const isDue = n => S.pegs[n].reps>0 && S.pegs[n].due>0 && today() >= S.pegs[n].due;
const isBloomed = n => tier(n)===4 && !isDue(n);
function meadowPct(){ let b=0; for(let n=0;n<=100;n++) if(isBloomed(n))b++; return Math.round(b/101*100); }
function bloomedCount(){ let b=0; for(let n=0;n<=100;n++) if(isBloomed(n))b++; return b; }

/* ---------- recording an answer ---------- */
function record(n, dir, ok, ms){
  const p=S.pegs[n];
  p.at[dir]++;
  const wasBloomed = isBloomed(n);
  if(ok){
    p.ok[dir]++; p.c[dir]++;
    if(ms!=null){ p.ema = p.ema==null ? ms : Math.round(p.ema*0.6 + ms*0.4); }
    const d=today(); if(!p.days.includes(d)){ p.days.push(d); if(p.days.length>6)p.days.shift(); }
    // spaced review advance if this was a due (or new) review
    p.reps = Math.min(SR.length, p.reps+1);
    p.due = today() + SR[Math.min(p.reps-1, SR.length-1)];
    addXP(10 + comboBonus());
  } else {
    p.c[dir]=0;
    p.reps = Math.max(0, p.reps-1);
    p.due = today(); // due now
  }
  const nowBloomed = isBloomed(n);
  if(!wasBloomed && nowBloomed){ onBloom(n); }
  save(); refreshHeader();
  return (!wasBloomed && nowBloomed);
}

/* ---------- xp / level / combo ---------- */
function levelFromXP(xp){ return Math.floor(Math.sqrt(xp/60))+1; }
function xpForLevel(l){ return Math.pow(l-1,2)*60; }
let combo=0, comboMax=0;
function comboBonus(){ return Math.min(20, Math.floor(combo/3)*2); }
function bumpCombo(){ combo++; comboMax=Math.max(comboMax,combo); showCombo(); }
function resetCombo(){ combo=0; }
function addXP(x){ const before=levelFromXP(S.xp); S.xp+=x; const after=levelFromXP(S.xp); if(after>before){ beep(660,.12); } }
function showCombo(){
  const el=stageHost.querySelector('#combo'); if(!el)return;
  if(combo>=3){ el.textContent=combo+'x'; el.classList.add('show'); }
  else el.classList.remove('show');
}

/* ---------- sound ---------- */
let actx=null;
function beep(freq,dur){
  if(!S.sound) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=freq; o.type='sine'; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.08,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function toggleSound(){ S.sound=!S.sound; save(); document.getElementById('soundBtn').textContent=S.sound?'on':'off'; if(S.sound)beep(520,.1); }

/* ---------- bloom moment ---------- */
function onBloom(n){
  beep(880,.15); setTimeout(()=>beep(1180,.18),120);
  const bf=document.getElementById('bloomflash');
  bf.classList.remove('go'); void bf.offsetWidth; bf.classList.add('go');
}

/* ---------- header ---------- */
function refreshHeader(){
  document.getElementById('flame').innerHTML='&#128293; '+(S.streak||0);
  const l=levelFromXP(S.xp), cur=xpForLevel(l), next=xpForLevel(l+1);
  document.getElementById('lvlLabel').textContent='Level '+l;
  document.getElementById('meadowPct').textContent='Meadow '+meadowPct()+'%';
  document.getElementById('xpfill').style.width=Math.min(100,((S.xp-cur)/(next-cur)*100))+'%';
  document.getElementById('soundBtn').textContent=S.sound?'on':'off';
  const dc=document.getElementById('dailyDesc');
  if(dc){ const due=allNums().filter(isDue).length; dc.textContent = due>0 ? (due+' review'+(due>1?'s':'')+' due today, plus a few new — your daily 15 questions.') : 'A quick 15-question round the game picks for you to keep every peg sharp.'; }
}

/* ---------- meadow grid ---------- */
function two(n){ return n<10 ? '0'+n : ''+n; }
function buildGrid(){
  const g=document.getElementById('grid101'); g.innerHTML='';
  for(let n=0;n<=100;n++){
    const t=tier(n); const due=isDue(n);
    const c=document.createElement('button');
    c.className='cell t'+t+(due?' due':'');
    c.innerHTML = (t===4&&!due)?'<span class="bl">&#10047;</span>':n;
    c.title=byN[n].word; c.onclick=()=>peek(n);
    g.appendChild(c);
  }
}
const TIERNAME=['Seed','Sprout','Learning','Solid','Bloomed'];
function peek(n){
  const p=byN[n]; const t=tier(n); const due=isDue(n);
  const pb=document.getElementById('peekBody');
  pb.className='peek t'+t+(due?' due':'');   // colour of the card = memorization level
  pb.innerHTML =
    '<button class="peek-close" onclick="closePeek()">&times;</button>'+
    '<div class="num">'+two(n)+'</div><div class="iconbox">'+p.svg+'</div>'+
    '<div class="theword">'+p.word+'</div>'+(p.caption?'<div class="thecap">'+p.caption+'</div>':'');
  document.getElementById('modal').classList.add('open');
}
function closePeek(){document.getElementById('modal').classList.remove('open');}

/* ---------- scope ---------- */
let scope=allNums();
function allNums(){const a=[];for(let n=0;n<=100;n++)a.push(n);return a;}
function setScope(v){
  if(v==='all')scope=allNums();
  else if(v==='weak')scope=allNums().filter(n=>tier(n)<3);
  else if(v==='due'){scope=allNums().filter(isDue); if(!scope.length)scope=allNums().filter(n=>tier(n)<4);}
  else{const[a,b]=v.split('-').map(Number);scope=[];for(let n=a;n<=b;n++)scope.push(n);}
  if(!scope.length)scope=allNums();
}

/* ---------- helpers ---------- */
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(pool,k,ex){return shuffle(pool.filter(n=>n!==ex)).slice(0,k);}
function weightedPick(pool){
  let tot=0;const w=pool.map(n=>{const p=S.pegs[n];let x=1+(4-tier(n))*2+(isDue(n)?3:0)+(p.at.n2w+p.at.w2n===0?2:0);tot+=x;return x;});
  let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}return pool[pool.length-1];
}

/* ---------- navigation ---------- */
const homeEl=document.getElementById('home'), playEl=document.getElementById('play'), stageHost=document.getElementById('stageHost');
let session=null, timerId=null, rainRAF=null;

  playEl.classList.remove('active'); homeEl.style.display='';

}
function enterPlay(){ homeEl.style.display='none'; playEl.classList.add('active'); document.getElementById('homeBtn').style.display='inline-block'; combo=0; comboMax=0; }

      '</div></div>'+

    fc.onclick=()=>{ fc.classList.toggle('flipped');
      document.getElementById('rate').innerHTML = fc.classList.contains('flipped')?

/* ============ THE CODE (intro lesson / major system) ============ */
const CODE=[
  {d:0, s:'S, Z',      h:'“Zero” starts with a Z sound.'},
  {d:1, s:'T, D, Th',  h:'t has one downstroke.'},
  {d:2, s:'N, Ng',     h:'n has two downstrokes.'},
  {d:3, s:'M',         h:'m has three downstrokes.'},
  {d:4, s:'R',         h:'“fouR” ends in R.'},
  {d:5, s:'L',         h:'L is the Roman numeral for 50; an open hand makes an L.'},
  {d:6, s:'J, Sh, Ch', h:'a handwritten J looks like a backwards 6.'},
  {d:7, s:'K, G',      h:'a K can be built from two 7s.'},
  {d:8, s:'F, V, Ph',  h:'a cursive f has two loops, like an 8.'},
  {d:9, s:'P, B',      h:'P is a mirror image of 9.'},
];
function runIntro(){
  enterPlay();
  const rows=CODE.map(c=>'<div class="coderow"><div class="cd">'+c.d+'</div><div class="ctext"><div class="csnd">'+c.s+'</div><div class="chook">'+c.h+'</div></div></div>').join('');
  stageHost.innerHTML=
    '<div class="codenote">This game trains the <b>Major System</b>: each <b>consonant sound</b> stands for a digit, while <b>vowels</b> and <b>w, h, y</b> are free filler. So <b>“sun”</b> (s&middot;n) is <b>0&thinsp;2</b>, and <b>“rose”</b> (r&middot;s) is <b>4&thinsp;0</b>. Learn these ten and every peg word builds itself.</div>'+
    '<div class="codelist">'+rows+'</div>'+
    '<div class="introbtns">'+
      '<button class="btn gold wide" onclick="runIntroQuiz()">Quiz me &rarr;</button>'+
      '<button class="btn ghost wide" onclick="goHome()">Back to meadow</button>'+
    '</div>';
}
function runIntroQuiz(){
  enterPlay();
  session={mode:'introquiz', i:0, score:0, order:shuffle(CODE.map(c=>c.d))};
  stageHost.innerHTML=
    '<div class="topline"><span>The Code</span><span><b id="iqn">1</b>/10</span></div>'+
    '<div class="stage"><div class="inner"><div id="qhead"></div><div id="qbody"></div></div></div>';
  introQ();
}
function introQ(){
  if(!session||session.mode!=='introquiz')return;
  if(session.i>=session.order.length)return endIntroQuiz();
  const d=session.order[session.i], c=CODE.find(x=>x.d===d);
  const dir=Math.random()<0.5?'d2s':'s2d';
  const opts=shuffle([c, ...shuffle(CODE.filter(x=>x.d!==d)).slice(0,3)]);
  let head, optHTML;
  if(dir==='d2s'){
    head='<div class="prompt-label">Which sounds does this digit stand for?</div><div class="bignum">'+d+'</div>';
    optHTML=opts.map(o=>'<button class="opt" data-d="'+o.d+'"><div class="word-opt">'+o.s+'</div></button>').join('');
  }else{
    head='<div class="prompt-label">Which digit do these sounds stand for?</div><div class="theword">'+c.s+'</div>';
    optHTML=opts.map(o=>'<button class="opt" data-d="'+o.d+'"><div class="num-opt">'+o.d+'</div></button>').join('');
  }
  stageHost.querySelector('#qhead').innerHTML=head;
  const box=stageHost.querySelector('#qbody');
  box.innerHTML='<div class="options">'+optHTML+'</div><div class="feedback" id="fb"></div>';
  box.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      if(!session||session.mode!=='introquiz')return;
      const chosen=+b.dataset.d, ok=chosen===d;
      box.querySelectorAll('.opt').forEach(x=>{x.setAttribute('disabled','');if(+x.dataset.d===d)x.classList.add('correct');else if(x===b)x.classList.add('wrong');});
      if(ok)session.score++;
      const fb=box.querySelector('#fb'); fb.textContent=(ok?'✓ ':'✗ ')+d+' = '+c.s; fb.className='feedback '+(ok?'good':'bad');
      session.i++;

function endIntroQuiz(){
  const s=session.score;
  stageHost.innerHTML=
    '<div class="stage"><div class="inner results center">'+
      '<h2>'+(s===10?'Perfect — you know the code!':'The Code')+'</h2>'+
      '<div class="bignum">'+s+'/10</div>'+
      '<div class="muted">sounds matched to digits</div>'+
      '<div class="mt"><button class="btn gold wide" onclick="runIntroQuiz()">Quiz again</button></div>'+
      '<div class="mt"><button class="btn ghost wide" onclick="runIntro()">Review the code</button></div>'+
      '<div class="mt"><button class="btn ghost wide" onclick="goHome()">Back to meadow</button></div>'+

}

/* ============ ROUNDS (drill / speed / diagnose / grind / daily) ============ */
const ROUND_LEN=15;
function startDaily(){
  const due=allNums().filter(isDue);
  const fresh=allNums().filter(n=>tier(n)<2);
  let set=shuffle(due).slice(0,10);
  set=set.concat(shuffle(fresh).slice(0,5));
  if(set.length<ROUND_LEN) set=set.concat(shuffle(allNums().filter(n=>!set.includes(n))).slice(0,ROUND_LEN-set.length));
  startRound('drill', shuffle(set).slice(0,ROUND_LEN), 'Daily Practice');
}
function startRound(mode, fixedSet, title){
  markPlayedToday(); enterPlay();
  if(mode==='speed') return runSpeed();
  if(mode==='diagnose') return runDiagnose();
  if(mode==='grind') return runGrind();
  // drill
  session={mode:'drill', title:title||'Practice Round', i:0, right:0, blooms:[], set: fixedSet||null};
  drillShell();
  nextDrill();
}
function shell(topHTML){
  stageHost.innerHTML='<div class="topline" id="tl">'+topHTML+'</div><div class="progbar"><i id="pb"></i></div>'+
    '<div class="stage"><div class="inner"><div class="combo" id="combo"></div><div id="qhead"></div><div id="qbody"></div></div></div>';
}
function drillShell(){ shell('<span>'+session.title+'</span><span><b id="rc">0</b>/'+ROUND_LEN+'</span>'); }
function setProg(i){ const pb=stageHost.querySelector('#pb'); if(pb)pb.style.width=(i/ROUND_LEN*100)+'%'; }
function renderMC(q,onPick){
  const p=byN[q.n]; const opts=shuffle([q.n,...sample(allNums(),3,q.n)]);
  const head = q.dir==='n2w'
    ? '<div class="prompt-label">Which picture is this?</div><div class="bignum">'+two(q.n)+'</div>'
    : '<div class="prompt-label">What number is this?</div><div class="iconbox">'+p.svg+'</div><div class="theword">'+p.word+'</div>'+(p.caption?'<div class="thecap">'+p.caption+'</div>':'');
  const optHTML=opts.map(o=> q.dir==='n2w'
    ? '<button class="opt" data-n="'+o+'"><div class="iconbox sm">'+byN[o].svg+'</div><div class="word-opt">'+byN[o].word+'</div></button>'
    : '<button class="opt" data-n="'+o+'"><div class="num-opt">'+two(o)+'</div></button>').join('');
  const qhead=stageHost.querySelector('#qhead'), box=stageHost.querySelector('#qbody');
  if(!qhead||!box)return;
  qhead.innerHTML=head; box.innerHTML='<div class="options">'+optHTML+'</div><div class="feedback" id="fb"></div>';
  const t0=performance.now();
  box.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const chosen=+b.dataset.n, ok=chosen===q.n, ms=performance.now()-t0;
      box.querySelectorAll('.opt').forEach(x=>{x.setAttribute('disabled','');if(+x.dataset.n===q.n)x.classList.add('correct');else if(x===b)x.classList.add('wrong');});
      onPick(ok,ms);
    };
  });
}
function nextDrill(){
  if(!session||session.mode!=='drill')return;
  if(session.i>=ROUND_LEN) return endDrill();
  setProg(session.i);
  const n = session.set ? session.set[session.i] : weightedPick(scope);
  const dir = Math.random()<0.5?'n2w':'w2n';
  renderMC({n,dir},(ok,ms)=>{
    session.i++; if(ok){session.right++;bumpCombo();beep(600,.07);}else{resetCombo();beep(200,.12);}
    const bloomed=record(n,dir,ok,ms); if(bloomed)session.blooms.push(n);
    const rc=stageHost.querySelector('#rc'); if(rc)rc.textContent=session.right;
    const fb=stageHost.querySelector('#fb'); fb.textContent=ok?(byN[n].word+' = '+two(n)):('It\u2019s '+two(n)+' \u2014 '+byN[n].word); fb.className='feedback '+(ok?'good':'bad');
    setTimeout(nextDrill, ok?650:1200);
  });
}
function endDrill(){
  setProg(ROUND_LEN);
  const acc=Math.round(session.right/ROUND_LEN*100);
  const xpGain=session.right*10;
  scorecard(session.title, [
    ['Correct', session.right+'/'+ROUND_LEN],
    ['Accuracy', acc+'%'],
    ['Best combo', comboMax+'x'],
    ['XP', '+'+xpGain]
  ], session.blooms, ()=>startRound('drill', session.set, session.title));
}

/* ============ SPEED ============ */
function runSpeed(){
  const DUR=60; session={mode:'speed',score:0,left:DUR,blooms:[]};
  shell('<span class="timer" id="tmr">'+DUR+'s</span><span>Score <b id="sc">0</b> &middot; Best <b>'+(S.best.speed||0)+'</b></span>');
  nextSpeed();
  const start=Date.now();
  timerId=setInterval(()=>{
    const el=(Date.now()-start)/1000; session.left=Math.max(0,DUR-el);
    const t=stageHost.querySelector('#tmr'); if(t)t.textContent=Math.ceil(session.left)+'s';
    const pb=stageHost.querySelector('#pb'); if(pb)pb.style.width=(session.left/DUR*100)+'%';
    if(session.left<=0){clearInterval(timerId);timerId=null;endSpeed();}
  },200);
}
function nextSpeed(){
  if(!session||session.mode!=='speed')return;
  const n=weightedPick(scope), dir=Math.random()<0.5?'n2w':'w2n';
  renderMC({n,dir},(ok,ms)=>{
    if(ok){session.score++;bumpCombo();beep(640,.06);}else{resetCombo();beep(200,.1);}
    const b=record(n,dir,ok,ms); if(b)session.blooms.push(n);
    const sc=stageHost.querySelector('#sc'); if(sc)sc.textContent=session.score;
    const fb=stageHost.querySelector('#fb'); fb.textContent=ok?'\u2713':'\u2717 '+two(n); fb.className='feedback '+(ok?'good':'bad');
    setTimeout(()=>{if(session&&session.left>0)nextSpeed();}, ok?240:460);
  });
}
function endSpeed(){
  const s=session.score, prev=S.best.speed||0; const pb=s>prev; if(pb)S.best.speed=s; save();
  scorecard('Time!', [['Score',s],['Best',Math.max(prev,s)],['Best combo',comboMax+'x'],['Blooms',session.blooms.length]], session.blooms, runSpeed, pb?'New best!':'');
}

/* ============ DIAGNOSE ============ */
function runDiagnose(){
  const queue=shuffle(scope.slice()); session={mode:'diagnose',queue,i:0,results:{},blooms:[]};
  shell('<span>Check-up</span><span><b id="rc">1</b>/'+queue.length+'</span>');
  stepDiag();
}
function stepDiag(){
  if(!session||session.mode!=='diagnose')return;
  if(session.i>=session.queue.length)return endDiag();
  const rc=stageHost.querySelector('#rc'); if(rc)rc.textContent=session.i+1;
  const pb=stageHost.querySelector('#pb'); if(pb)pb.style.width=(session.i/session.queue.length*100)+'%';
  const n=session.queue[session.i], dir=Math.random()<0.5?'n2w':'w2n';
  renderMC({n,dir},(ok,ms)=>{
    session.results[n]=ok; const b=record(n,dir,ok,ms); if(b)session.blooms.push(n);
    if(ok){bumpCombo();beep(600,.06);}else resetCombo();
    const fb=stageHost.querySelector('#fb'); fb.textContent=ok?'\u2713':'It\u2019s '+two(n)+' \u2014 '+byN[n].word; fb.className='feedback '+(ok?'good':'bad');
    session.i++; setTimeout(stepDiag, ok?500:1000);
  });
}
function endDiag(){
  const weak=Object.keys(session.results).filter(n=>!session.results[n]).map(Number).sort((a,b)=>a-b);
  const right=session.queue.length-weak.length;
  let grid='<div class="grid101" style="margin-top:6px">';
  session.queue.slice().sort((a,b)=>a-b).forEach(n=>{ grid+='<button class="cell" style="'+(session.results[n]?'background:var(--bloom);border-color:var(--accent-deep);color:#4a3410':'background:#f6e3e0;border-color:#c0392b;color:#c0392b')+'" onclick="peek('+n+')">'+n+'</button>'; });
  grid+='</div>';
  const tags= weak.length? weak.map(n=>'<span class="weaktag">'+two(n)+' '+byN[n].word+'</span>').join('') : '<div class="muted center">No misses \u2014 beautifully solid.</div>';
  stageHost.innerHTML='<div class="stage"><div class="inner results">'+
    '<h2>Check-up</h2><div class="sub">'+right+' / '+session.queue.length+' correct</div>'+
    '<div class="bloomrow">'+tags+'</div>'+grid+
    (weak.length?'<div class="mt"><button class="btn gold wide" onclick="grindThese(['+weak.join(',')+'])">Grind these '+weak.length+'</button></div>':'')+
    '<div class="mt"><button class="btn ghost wide" onclick="goHome()">Back to meadow</button></div></div></div>';
}

/* ============ GRIND (type) ============ */
function runGrind(){ grindThese(scope.filter(n=>tier(n)<3)); }
function grindThese(pool){
  enterPlay();
  if(!pool||!pool.length){ stageHost.innerHTML='<div class="stage"><div class="inner results center"><h2>Nothing to grind</h2><div class="muted">Every peg in this set is already solid.</div><div class="mt"><button class="btn ghost wide" onclick="goHome()">Back to meadow</button></div></div></div>'; return; }
  session={mode:'grind',pool:shuffle(pool.slice()),need:{},total:pool.length,blooms:[]};
  pool.forEach(n=>session.need[n]=2);
  shell('<span>Grind</span><span><b id="rc">0</b>/'+session.total+' cleared</span>');
  nextGrind();
}
function nextGrind(){
  if(!session||session.mode!=='grind')return;
  const rem=session.pool.filter(n=>session.need[n]>0);
  if(!rem.length)return endGrind();
  const rc=stageHost.querySelector('#rc'); if(rc)rc.textContent=session.total-rem.length;
  const pb=stageHost.querySelector('#pb'); if(pb)pb.style.width=((session.total-rem.length)/session.total*100)+'%';
  const n=rem[rnd(rem.length)], p=byN[n], dir=Math.random()<0.5?'n2w':'w2n';
  const head = dir==='n2w'
    ? '<div class="prompt-label">Type the word for this number</div><div class="bignum">'+two(n)+'</div>'
    : '<div class="prompt-label">Type the number for this picture</div><div class="iconbox">'+p.svg+'</div>';
  stageHost.querySelector('#qhead').innerHTML=head;
  stageHost.querySelector('#qbody').innerHTML='<div class="typerow"><input id="ans" autocomplete="off" autocapitalize="off" '+(dir==='w2n'?'inputmode="numeric" ':'')+'placeholder="'+(dir==='n2w'?'the word\u2026':'the number\u2026')+'"/><button class="btn" id="go">Check</button></div><div class="feedback" id="fb"></div>';
  const inp=document.getElementById('ans'); inp.focus();
  const t0=performance.now();
  function submit(){
    const v=inp.value.trim(); if(!v)return;
    const ok = dir==='n2w' ? v.toLowerCase()===p.word.toLowerCase() : (v.replace(/\D/g,'')!==''&&parseInt(v,10)===n);
    const fb=document.getElementById('fb');
    if(ok){ session.need[n]--; const b=record(n,dir,true,performance.now()-t0); if(b)session.blooms.push(n); bumpCombo(); beep(620,.07);
      fb.textContent=session.need[n]>0?'\u2713 once more to clear':'\u2713 cleared!'; fb.className='feedback good';
    } else { session.need[n]=2; record(n,dir,false,null); resetCombo(); beep(200,.12);
      fb.textContent=dir==='n2w'?('It\u2019s "'+p.word+'"'):('It\u2019s '+two(n)+' \u2014 '+p.word); fb.className='feedback bad'; }
    setTimeout(nextGrind, ok?600:1400);
  }
  document.getElementById('go').onclick=submit;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
}
function endGrind(){
  scorecard('All cleared', [['Pegs cleared',session.total],['Best combo',comboMax+'x'],['Blooms',session.blooms.length],['XP','+'+session.total*20]], session.blooms, ()=>goHome(), '', true);
}

/* ============ SCORECARD ============ */
function scorecard(title, stats, blooms, again, tagline, hideAgain){
  let sc='<div class="statgrid">'+stats.map(s=>'<div class="stat"><div class="v">'+s[1]+'</div><div class="k">'+s[0]+'</div></div>').join('')+'</div>';
  let bl = blooms&&blooms.length? '<div class="center muted" style="font-size:.85rem">New blooms</div><div class="bloomrow">'+blooms.map(n=>'<span class="bloomtag">&#10047; '+two(n)+' '+byN[n].word+'</span>').join('')+'</div>' : '';
  stageHost.innerHTML='<div class="stage"><div class="inner results">'+
    '<h2>'+title+'</h2>'+(tagline?'<div class="sub">'+tagline+'</div>':'<div class="sub">Meadow '+meadowPct()+'% bloomed</div>')+
    sc+bl+
    (hideAgain?'':'<div class="mt"><button class="btn gold wide" id="again">Go again</button></div>')+
    '<div class="mt"><button class="btn ghost wide" onclick="goHome()">Back to meadow</button></div></div></div>';
  const a=document.getElementById('again'); if(a)a.onclick=again;
}

/* ============ DAISY RAIN ============ */
let rainDiff='gentle';
const RAIN_CFG={ gentle:{fall:9000,ramp:180,min:4200,spawnGap:1400}, normal:{fall:6500,ramp:220,min:3200,spawnGap:1050}, brisk:{fall:4800,ramp:260,min:2400,spawnGap:800} };
function rainIntro(){
  enterPlay();
  stageHost.innerHTML='<div class="stage"><div class="inner center">'+
    '<h2 style="font-family:var(--serif);font-size:1.6rem">Daisy Rain &#127804;</h2>'+
    '<p class="muted" style="margin:8px 0 4px">A peg drifts down from the sky. Tap its match at the bottom before it lands. It starts slow and speeds up gently. You have three lives.</p>'+
    '<div class="diffrow">'+
      '<button class="diffbtn '+(rainDiff==='gentle'?'sel':'')+'" data-d="gentle">Gentle</button>'+
      '<button class="diffbtn '+(rainDiff==='normal'?'sel':'')+'" data-d="normal">Normal</button>'+
      '<button class="diffbtn '+(rainDiff==='brisk'?'sel':'')+'" data-d="brisk">Brisk</button>'+
    '</div>'+
    '<div class="muted" style="font-size:.8rem">Best: '+(S.best.rain||0)+'</div>'+
    '<div class="mt"><button class="btn gold wide" id="startRain">Start</button></div>'+
    '<div class="mt"><button class="btn ghost wide" onclick="goHome()">Back to meadow</button></div>'+
  '</div></div>';
  stageHost.querySelectorAll('.diffbtn').forEach(b=>b.onclick=()=>{rainDiff=b.dataset.d; stageHost.querySelectorAll('.diffbtn').forEach(x=>x.classList.toggle('sel',x===b));});
  document.getElementById('startRain').onclick=runRain;
}
function runRain(){
  markPlayedToday(); enterPlay();
  const cfg=RAIN_CFG[rainDiff];
  session={mode:'rain', score:0, lives:3, catches:0, blooms:[], fall:cfg.fall, cfg, current:null, y:0, lastT:0};
  stageHost.innerHTML=
    '<div class="rainhud"><span class="hearts" id="hearts">&#10084;&#10084;&#10084;</span><span>Score <b id="rsc">0</b></span><span>Best <b>'+(S.best.rain||0)+'</b></span></div>'+
    '<div id="rainStage"></div>'+
    '<div class="rainchoices" id="rchoices"></div>';
  spawnFaller();
  session.lastT=performance.now();
  rainRAF=requestAnimationFrame(rainTick);
}
function spawnFaller(){
  const st=document.getElementById('rainStage'); if(!st)return;
  const n=weightedPick(scope);
  const showIcon = Math.random()<0.5;  // faller shows icon -> pick number; else shows number -> pick icon
  session.current={n, mode: showIcon?'icon':'num'};
  const el=document.createElement('div'); el.className='faller'; el.id='faller';
  el.innerHTML = showIcon
    ? '<div class="ficon">'+byN[n].svg+'</div><div class="fword">'+byN[n].word+'</div>'
    : '<div class="fnum">'+two(n)+'</div>';
  const w=st.clientWidth; el.style.left=Math.max(6, rnd(w-110))+'px';
  st.appendChild(el);
  session.y=-90; session.spawnedAt=performance.now();
  // choices at bottom: opposite representation
  const opts=shuffle([n,...sample(allNums(),3,n)]);
  const rc=document.getElementById('rchoices');
  rc.innerHTML=opts.map(o=> showIcon
    ? '<button class="rchoice" data-n="'+o+'"><div class="rn">'+two(o)+'</div></button>'
    : '<button class="rchoice" data-n="'+o+'"><div class="riconbox">'+byN[o].svg+'</div></button>').join('');
  rc.querySelectorAll('.rchoice').forEach(b=>b.onclick=()=>rainAnswer(+b.dataset.n,b));
}
function rainTick(t){
  if(!session||session.mode!=='rain')return;
  const st=document.getElementById('rainStage'); const el=document.getElementById('faller');
  if(!st||!el){return;}
  const dt=t-session.lastT; session.lastT=t;
  const dist=st.clientHeight+90;
  session.y += dist*(dt/session.fall);
  el.style.transform='translateY('+session.y+'px)';
  if(session.y >= st.clientHeight-4){
    // landed -> lose a life
    loseLife();
    if(session&&session.mode==='rain'){ el.remove(); spawnFaller(); }
  }
  if(session&&session.mode==='rain') rainRAF=requestAnimationFrame(rainTick);
}
function rainAnswer(chosen, btn){
  if(!session||!session.current)return;
  const n=session.current.n, ok=chosen===n, dir=session.current.mode==='icon'?'w2n':'n2w';
  const b=record(n,dir,ok,null); if(b)session.blooms.push(n);
  const el=document.getElementById('faller');
  if(ok){
    session.score++; session.catches++; bumpCombo(); beep(680,.06);
    document.getElementById('rsc').textContent=session.score;
    // gentle ramp
    session.fall=Math.max(session.cfg.min, session.fall - session.cfg.ramp);
    if(el)el.remove(); spawnFaller();
  } else {
    resetCombo(); beep(200,.12); if(btn)btn.classList.add('wrong');
    loseLife();
    if(session&&session.mode==='rain'){ if(el)el.remove(); spawnFaller(); }
  }
}
function loseLife(){
  session.lives--;
  const h=document.getElementById('hearts'); if(h)h.innerHTML='&#10084;'.repeat(Math.max(0,session.lives))+'&#9825;'.repeat(3-Math.max(0,session.lives));
  if(session.lives<=0) endRain();
}
function endRain(){
  if(rainRAF){cancelAnimationFrame(rainRAF);rainRAF=null;}
  const s=session.score, prev=S.best.rain||0, pb=s>prev; if(pb)S.best.rain=s; save();
  const blooms=session.blooms;
  session=null;
  scorecard('Daisy Rain', [['Caught',s],['Best',Math.max(prev,s)],['Best combo',comboMax+'x'],['Blooms',blooms.length]], blooms, rainIntro, pb?'New best!':'');
}

/* ---------- reset ---------- */
function resetAll(){ S=freshState(); save(); combo=0; goHome(); }

/* ---------- boot ---------- */
buildGrid(); refreshHeader();
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('modal').classList.contains('open'))closePeek(); });
</script>
